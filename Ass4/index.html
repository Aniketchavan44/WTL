<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript User Interaction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 50px 20px;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #00000020;
        }
        
        input {
            padding: 12px;
            width: 65%;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        button {
            padding: 12px 20px;
            background: #3178c6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #display {
            margin-top: 20px;
            font-size: 18px;
            color: #16803c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>TypeScript User Interaction</h1>

        <p>Enter your name below:</p>

        <input type="text" id="name" placeholder="Enter your name">

        <button id="greetBtn">Greet Me</button>

        <div id="display" aria-live="polite"></div>
    </div>

    <script src="app.js"></script>
</body>

</html>

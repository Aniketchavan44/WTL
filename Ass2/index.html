<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 40px 15px;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #cccccc;
        }
        
        h1 {
            color: #2563eb;
        }
        
        input {
            width: 65%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        
        button {
            padding: 12px 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #1d4ed8;
        }
        
        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        
        li {
            background: #eaf0ff;
            margin: 10px 0;
            padding: 12px;
            border-radius: 5px;
            text-align: left;
            overflow-wrap: anywhere;
            cursor: pointer;
        }
        
        li.completed {
            text-decoration: line-through;
            color: gray;
            background: #d1fae5;
        }
        
        .hint {
            color: #666;
            font-size: 13px;
        }
        
        @media (max-width: 480px) {
            input {
                width: 100%;
                margin-bottom: 10px;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>My To-Do List</h1>

        <input type="text" id="taskInput" placeholder="Enter a new task">

        <button onclick="addTask()">Add Task</button>

        <p class="hint">
            Click a task to complete it. Double-click to delete it.
        </p>

        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById("taskInput");
            const task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            const li = document.createElement("li");
            li.textContent = task;

            li.onclick = function() {
                li.classList.toggle("completed");
            };

            li.ondblclick = function() {
                li.remove();
            };

            document.getElementById("taskList").appendChild(li);

            input.value = "";
            input.focus();
        }

        document.getElementById("taskInput").addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    addTask();
                }
            }
        );
    </script>

</body>

</html>

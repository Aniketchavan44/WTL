<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API - User Data</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #222;
        }
        
        .container {
            max-width: 1000px;
            margin: auto;
            text-align: center;
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        #message {
            margin: 20px 0;
            font-weight: bold;
        }
        
        #users {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
            text-align: left;
        }
        
        .user-card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #00000015;
            overflow-wrap: anywhere;
        }
        
        .user-card h3 {
            color: #007bff;
            margin-top: 0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Fetch User Data</h1>

        <p>Click the button to fetch user details from the API.</p>

        <button id="loadButton">Load Users</button>

        <p id="message" role="status" aria-live="polite"></p>

        <div id="users"></div>
    </div>

    <script>
        const loadButton = document.getElementById("loadButton");
        const usersContainer = document.getElementById("users");
        const message = document.getElementById("message");

        async function fetchUsers() {
            usersContainer.replaceChildren();
            message.textContent = "Loading users...";
            loadButton.disabled = true;

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch user data.");
                }

                const users = await response.json();

                users.forEach(function(user) {
                    const card = document.createElement("div");
                    card.className = "user-card";

                    const name = document.createElement("h3");
                    name.textContent = user.name;

                    const email = document.createElement("p");
                    email.textContent = "Email: " + user.email;

                    const city = document.createElement("p");
                    city.textContent = "City: " + user.address.city;

                    const company = document.createElement("p");
                    company.textContent = "Company: " + user.company.name;

                    card.append(name, email, city, company);
                    usersContainer.appendChild(card);
                });

                message.textContent = "Users loaded successfully!";
            } catch (error) {
                message.textContent =
                    "Error loading users. Please check your internet and try again.";
                console.error(error);
            } finally {
                loadButton.disabled = false;
            }
        }

        loadButton.addEventListener("click", fetchUsers);
    </script>

</body>

</html>
